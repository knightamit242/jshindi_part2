<!-- 6
Node Kya Hota Hai?
DOM ka har part ek node hota hai.

1. Element Node
HTML tags

<div></div>
<h1></h1>
<p></p>
Ye sab element nodes hain.

2. Text Node
Tags ke andar ka text.
<h1>DOM Learning</h1>

Yahan:
h1 → Element Node
DOM Learning → Text Node

3. Attribute Node
Tag ke attributes.
<div class="bg-black">

Yahan:
class="bg-black"
attribute hai. -->
