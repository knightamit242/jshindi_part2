<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #0000008c; color: white;">
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>
<script>
    //AB HUM EK FUNCTION BANAKAR ELEMENTS ADD KRTE HAI... 

    function addElement(langName){   // YAHA HAMNE EK langName KA FUNCTION BNA LIYA
        const one= document.createElement('li') //AUR USME EK li ELEMENT KO ADD KIYA 
        one.innerHTML= `${langName}`   // TEXT SET KIYA 

        // AB ISKE BAAD li KO ADD BHI KRNA PADEGA ul  MEIN...
        // document.querySelector('.language').appendChild(one) // 1st METHOD
        // YAHA SABSE PEHLE US CLASS KO SELECT KIYA JISKA NAAM language HAI... JO YAHA 
        // UL TAG HAI.... PHIR USME one KO APPEND KR DIYA

        document.querySelector('ul').appendChild(one) // OR 2nd METHOD
    }

    addElement("python")
</script>
</html>

Matlab page load hote hi tumhe ek list item "javascript" dikh jaata hai.

2. JavaScript part (script ke andar)

Jab browser HTML pura read kar leta hai, uske baad <script> section aata hai.
Yaha tumne ek function addElement(langName) banaya hai. Ye function abhi sirf define hota hai (matlab ready hai chalne ke liye, par abhi execute nahi hua).

3. Function call (script ke end mein)

Tumne addElement("python") likha hai.
Isse function run hota hai → ek naya <li> banata hai → usme "python" likhta hai → aur usko .language wale <ul> ke andar append kar deta hai.


👉 Is tarah se browser sequentially kaam karta hai:
Pehle HTML render karta hai (output mein "javascript" dikhta hai).
Phir JS execute hota hai (output mein "python" add ho jaata hai).
Dono ek hi page pe ek saath dikhte hain kyunki browser HTML aur JS ko combine karke final DOM banata hai.

python

<!-- Amit, ye point bahut important hai. ANSWER👇

Tumne document.querySelector('.language') use kiya hai.
Ye specifically class="language" wale <ul> ko select karta hai. Matlab browser ko clear instruction milta hai ki jis element ki class "language" hai, usko target karo.

Agar tum direct <ul> tag ko select karna chahte ho to document.querySelector('ul') likh sakte ho. Lekin agar page mein multiple <ul> tags ho jaayein, to phir confusion hoga ki kaunse <ul> mein element add karna hai.

.language likhne ka fayda ye hai ki tumne apne <ul> ko ek unique class de di, aur usko target karna easy ho gaya. Ye best practice hai — specific selector use karna.
.language → class selector
#idName → id selector
tagName → tag selector (jaise ul, li, p)

Isliye tumne .language use kiya, taaki ul ke andar jo class "language" hai usi ko pakda jaaye.
